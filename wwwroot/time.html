<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>此刻 · Server Time</title>
  <style>
    :root {
      --bg0: #0b1020;
      --bg1: #151c33;
      --card: rgba(255,255,255,0.06);
      --stroke: rgba(255,255,255,0.12);
      --text: #f4f7ff;
      --muted: #9aa6c3;
      --accent: #6ee7ff;
      --accent2: #a78bfa;
      --ok: #34d399;
      --err: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(110,231,255,0.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(167,139,250,0.2), transparent 55%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 32px 28px 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }
    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 28px;
      line-height: 1.5;
      font-size: 15px;
    }
    .display {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      padding: 22px 20px;
      min-height: 168px;
      margin-bottom: 20px;
    }
    .greeting {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .date-line {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(40px, 10vw, 56px);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.1;
      margin: 0 0 12px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta span strong { color: var(--text); font-weight: 600; }
    .placeholder {
      color: var(--muted);
      padding-top: 36px;
      text-align: center;
      font-size: 15px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .primary {
      color: #041018;
      background: linear-gradient(135deg, var(--accent), #5eead4);
      box-shadow: 0 10px 30px rgba(110,231,255,0.25);
    }
    .ghost {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--stroke);
    }
    .status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .foot {
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
    }
    .foot a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">netcore31 · live clock</div>
    <h1>服务器此刻</h1>
    <p class="sub">点一下按钮，调用 <code>/api/time</code>，把返回的时间做成更有人情味的展示。</p>

    <section class="display" id="panel" aria-live="polite">
      <div class="placeholder" id="placeholder">还没有取过时间，点下面的按钮开始。</div>
      <div id="content" hidden>
        <div class="greeting" id="greeting"></div>
        <div class="date-line" id="dateLine"></div>
        <div class="clock" id="clock"></div>
        <div class="meta">
          <span>时区 <strong id="tz"></strong></span>
          <span>Unix ms <strong id="unix"></strong></span>
          <span>UTC <strong id="utc"></strong></span>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="primary" id="btn" type="button">刷新服务器时间</button>
      <button class="ghost" id="btnHome" type="button">回首页</button>
    </div>
    <div class="status" id="status"></div>
    <div class="foot">接口：<a href="/api/time">/api/time</a> · 页面：<a href="/time.html">/time.html</a></div>
  </main>

  <script>
    (function () {
      var weekdaysZh = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      var weekdaysEn = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

      var btn = document.getElementById("btn");
      var statusEl = document.getElementById("status");
      var placeholder = document.getElementById("placeholder");
      var content = document.getElementById("content");

      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function periodLabel(hours) {
        if (hours < 5) return "夜深了";
        if (hours < 9) return "早上好";
        if (hours < 12) return "上午好";
        if (hours < 14) return "中午好";
        if (hours < 18) return "下午好";
        if (hours < 22) return "晚上好";
        return "夜深了";
      }

      function formatFromApi(data) {
        // Prefer local wall time from API; fall back to utc
        var raw = data.local || data.utc;
        var d = new Date(raw);
        if (isNaN(d.getTime())) throw new Error("无法解析时间: " + raw);

        var h = d.getHours();
        var m = d.getMinutes();
        var s = d.getSeconds();
        var y = d.getFullYear();
        var mo = d.getMonth() + 1;
        var day = d.getDate();
        var wd = d.getDay();

        var greeting = periodLabel(h) + " · " + weekdaysZh[wd] + " / " + weekdaysEn[wd];
        var dateLine = y + "年" + mo + "月" + day + "日 · " + weekdaysZh[wd];
        var clock = pad(h) + ":" + pad(m) + ":" + pad(s);

        document.getElementById("greeting").textContent = greeting;
        document.getElementById("dateLine").textContent = dateLine;
        document.getElementById("clock").textContent = clock;
        document.getElementById("tz").textContent = data.timeZone || "—";
        document.getElementById("unix").textContent = data.unixMs != null ? String(data.unixMs) : "—";
        document.getElementById("utc").textContent = data.utc ? String(data.utc).replace("T", " ").replace(/\+.*/, " UTC") : "—";

        placeholder.hidden = true;
        content.hidden = false;
      }

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = "status" + (kind ? " " + kind : "");
      }

      async function refresh() {
        btn.disabled = true;
        setStatus("正在请求 /api/time …");
        try {
          var res = await fetch("/api/time", { headers: { "Accept": "application/json" } });
          if (!res.ok) throw new Error("HTTP " + res.status);
          var data = await res.json();
          formatFromApi(data);
          setStatus("已更新 · " + new Date().toLocaleTimeString(), "ok");
        } catch (err) {
          setStatus("调用失败：" + (err && err.message ? err.message : String(err)), "err");
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", refresh);
      document.getElementById("btnHome").addEventListener("click", function () {
        window.location.href = "/";
      });
    })();
  </script>
</body>
</html>
