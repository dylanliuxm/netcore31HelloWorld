<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>此刻时间</title>
  <style>
    :root {
      --bg: #0B1220;
      --panel: #1A2A40;
      --red: #C8102E;
      --red-dark: #8B0A1E;
      --gold: #D4A017;
      --gold-soft: #E8C547;
      --text: #FFFFFF;
      --muted: #9AA8BC;
      --nav-bg: #0F1A2E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    /* Header */
    .header {
      background: var(--red);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #fff;
      color: var(--red);
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      line-height: 1;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--red-dark);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 3px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
    }
    /* Nav */
    .nav {
      background: var(--nav-bg);
      height: 40px;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .nav a {
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 2px;
    }
    .nav a.active {
      color: var(--gold-soft);
      font-weight: 700;
    }
    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 24px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }
    .subtitle {
      text-align: center;
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      margin-bottom: 18px;
    }
    .panel {
      width: 100%;
      background: var(--panel);
      border-radius: 4px;
      padding: 28px 24px 18px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(42px, 12vw, 56px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 10px;
    }
    .date-line {
      color: #C5D0DE;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .divider {
      height: 2px;
      background: var(--red);
      width: 100%;
      margin: 0 auto 14px;
      border-radius: 1px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .meta-row .tz { color: #fff; }
    .meta-row .sync { color: var(--gold); font-weight: 600; }
    .info-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .info-card {
      background: var(--panel);
      border-radius: 4px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.06);
      text-align: left;
    }
    .info-card .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .info-card .value {
      display: block;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .info-card .value.ok { color: #fff; }
    .btn-refresh {
      width: 100%;
      margin-top: 18px;
      appearance: none;
      border: none;
      cursor: pointer;
      background: var(--red);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 14px 20px;
      border-radius: 4px;
      transition: background .15s ease, opacity .15s ease;
    }
    .btn-refresh:hover { background: #E01436; }
    .btn-refresh:active { opacity: 0.9; }
    .btn-refresh:disabled { opacity: 0.55; cursor: wait; }
    .hint {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .home-link {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .home-link a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(212, 160, 23, 0.35);
    }
    .status {
      margin-top: 8px;
      min-height: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .status.ok { color: #5CB85C; }
    .status.err { color: #E85A5A; }
    /* Footer ticker */
    .ticker {
      flex-shrink: 0;
      background: var(--red);
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }
    .flash {
      background: #fff;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 2px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .ticker-text {
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true">央</span>
      <span class="title">此刻时间</span>
    </div>
    <span class="live"><span class="live-dot" aria-hidden="true"></span>直播</span>
  </header>

  <nav class="nav" aria-label="栏目">
    <a href="#">要闻</a>
    <a href="/time.html" class="active">时间</a>
    <a href="#">时政</a>
    <a href="#">国际</a>
  </nav>

  <main class="main">
    <div class="subtitle">北京时间 · BEIJING TIME</div>

    <section class="panel" aria-live="polite">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-line" id="dateLine">正在校时…</div>
      <div class="divider" aria-hidden="true"></div>
      <div class="meta-row">
        <span class="tz" id="tzLabel">时区 UTC+8</span>
        <span class="sync">服务器校时</span>
      </div>
    </section>

    <div class="info-grid">
      <div class="info-card">
        <span class="label">接口</span>
        <span class="value" id="apiPath">/api/time</span>
      </div>
      <div class="info-card">
        <span class="label">状态</span>
        <span class="value ok" id="apiStatus">—</span>
      </div>
    </div>

    <button class="btn-refresh" id="btn" type="button">刷新此刻时间</button>
    <p class="hint">数据来自服务器 · 点击刷新获取最新时间</p>
    <div class="status" id="status"></div>
    <p class="home-link"><a href="/">返回首页</a></p>
  </main>

  <footer class="ticker">
    <span class="flash">快讯</span>
    <span class="ticker-text">服务器时间已同步 · 精确到秒</span>
  </footer>

  <script>
    (function () {
      var weekdaysZh = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      var btn = document.getElementById("btn");
      var statusEl = document.getElementById("status");
      var clockEl = document.getElementById("clock");
      var dateEl = document.getElementById("dateLine");
      var apiStatus = document.getElementById("apiStatus");
      var tzLabel = document.getElementById("tzLabel");

      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function formatFromApi(data) {
        var raw = data.local || data.utc;
        var d = new Date(raw);
        if (isNaN(d.getTime())) throw new Error("无法解析时间: " + raw);

        var h = d.getHours();
        var m = d.getMinutes();
        var s = d.getSeconds();
        var y = d.getFullYear();
        var mo = d.getMonth() + 1;
        var day = d.getDate();
        var wd = d.getDay();

        clockEl.textContent = pad(h) + ":" + pad(m) + ":" + pad(s);
        dateEl.textContent = y + "年" + mo + "月" + day + "日 " + weekdaysZh[wd];

        var tz = data.timeZone || "UTC+8";
        if (/UTC/i.test(tz) && !/\+/.test(tz) && tz.toUpperCase() === "UTC") {
          tzLabel.textContent = "时区 UTC";
        } else if (/^\+?\d/.test(tz) || /UTC/i.test(tz)) {
          tzLabel.textContent = "时区 " + (tz.indexOf("UTC") >= 0 ? tz : "UTC" + (tz.charAt(0) === "+" || tz.charAt(0) === "-" ? tz : "+" + tz));
        } else {
          tzLabel.textContent = "时区 " + tz;
        }

        apiStatus.textContent = "正常";
      }

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = "status" + (kind ? " " + kind : "");
      }

      async function refresh() {
        btn.disabled = true;
        setStatus("正在校时…");
        try {
          var res = await fetch("/api/time", { headers: { "Accept": "application/json" } });
          if (!res.ok) throw new Error("HTTP " + res.status);
          var data = await res.json();
          formatFromApi(data);
          setStatus("已同步 · " + new Date().toLocaleTimeString(), "ok");
        } catch (err) {
          apiStatus.textContent = "异常";
          setStatus("校时失败：" + (err && err.message ? err.message : String(err)), "err");
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", refresh);
      refresh();
    })();
  </script>
</body>
</html>
