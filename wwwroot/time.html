<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>此刻 · 元气时钟</title>
  <style>
    :root {
      --ink: #1a1033;
      --muted: #6b5b8c;
      --card: rgba(255, 255, 255, 0.72);
      --stroke: rgba(255, 255, 255, 0.55);
      --pink: #ff6bb5;
      --violet: #8b5cf6;
      --sky: #38bdf8;
      --mint: #34d399;
      --sun: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Display", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      background:
        radial-gradient(900px 500px at 12% 8%, rgba(255, 107, 181, 0.55), transparent 55%),
        radial-gradient(800px 480px at 88% 12%, rgba(139, 92, 246, 0.5), transparent 50%),
        radial-gradient(700px 520px at 50% 100%, rgba(56, 189, 248, 0.45), transparent 55%),
        linear-gradient(165deg, #fff7fb 0%, #f3e8ff 45%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
      animation: float 9s ease-in-out infinite;
    }
    .blob.a { width: 220px; height: 220px; background: var(--pink); top: 8%; left: 6%; }
    .blob.b { width: 180px; height: 180px; background: var(--sky); bottom: 12%; right: 8%; animation-delay: -3s; }
    .blob.c { width: 140px; height: 140px; background: var(--sun); top: 55%; left: 18%; animation-delay: -5s; opacity: 0.35; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.05); }
    }
    .card {
      position: relative;
      z-index: 1;
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 32px;
      padding: 28px 24px 22px;
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
      box-shadow:
        0 30px 80px rgba(139, 92, 246, 0.18),
        0 8px 24px rgba(255, 107, 181, 0.12),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,107,181,0.18), rgba(139,92,246,0.18));
      color: #7c3aed;
    }
    .mood {
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .mood.pop { transform: scale(1.25) rotate(-8deg); }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #ec4899, #8b5cf6 45%, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .stage {
      position: relative;
      border-radius: 24px;
      padding: 22px 18px 18px;
      background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.55));
      border: 1px solid rgba(255,255,255,0.75);
      box-shadow: inset 0 1px 0 #fff, 0 12px 30px rgba(139, 92, 246, 0.08);
      min-height: 176px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: auto -20% -40% 20%;
      height: 120px;
      background: radial-gradient(circle, rgba(255,107,181,0.25), transparent 70%);
      pointer-events: none;
    }
    .placeholder {
      text-align: center;
      padding: 42px 8px 28px;
      color: var(--muted);
      font-size: 15px;
    }
    .placeholder .spark { font-size: 36px; display: block; margin-bottom: 10px; }
    .greeting {
      font-size: 16px;
      font-weight: 700;
      color: #7c3aed;
      margin-bottom: 4px;
    }
    .date-line {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(48px, 14vw, 64px);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
      margin: 0 0 14px;
      background: linear-gradient(120deg, #1a1033 10%, #7c3aed 50%, #ec4899 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .clock.bump { transform: scale(1.04); }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      font-size: 12px;
      font-weight: 600;
      color: #4c1d95;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.18);
      border-radius: 999px;
      padding: 6px 10px;
    }
    .chip strong { font-weight: 700; }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .2s ease, opacity .15s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .primary {
      flex: 1;
      min-width: 160px;
      color: #fff;
      background: linear-gradient(135deg, #ff6bb5, #8b5cf6 55%, #38bdf8);
      box-shadow: 0 12px 28px rgba(236, 72, 153, 0.35);
    }
    .primary:hover { box-shadow: 0 16px 34px rgba(139, 92, 246, 0.4); }
    .ghost {
      color: #5b21b6;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(139, 92, 246, 0.22);
    }
    .status {
      margin-top: 12px;
      min-height: 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .status.ok { color: #059669; }
    .status.err { color: #e11d48; }
    .foot {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .foot a {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed rgba(124, 58, 237, 0.35);
    }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.18);
      color: #047857;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="blob a" aria-hidden="true"></div>
  <div class="blob b" aria-hidden="true"></div>
  <div class="blob c" aria-hidden="true"></div>

  <main class="card">
    <div class="top-row">
      <span class="pill">✨ 元气时钟</span>
      <span class="mood" id="mood" aria-hidden="true">🌤️</span>
    </div>
    <h1>今天几点啦？</h1>
    <p class="sub">点一下，去问服务器此刻的心情时间——比干巴巴的 JSON 好看多了。</p>

    <section class="stage" id="panel" aria-live="polite">
      <div class="placeholder" id="placeholder">
        <span class="spark">🚀</span>
        还没取过时间，点下面按钮开冲
      </div>
      <div id="content" hidden>
        <div class="greeting" id="greeting"></div>
        <div class="date-line" id="dateLine"></div>
        <div class="clock" id="clock"></div>
        <div class="chips">
          <span class="chip">🌍 <strong id="tz"></strong></span>
          <span class="chip">⏱ <strong id="unix"></strong></span>
          <span class="chip">☁️ <strong id="utc"></strong></span>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="primary" id="btn" type="button">刷新这一刻 ✨</button>
      <button class="ghost" id="btnHome" type="button">回首页</button>
    </div>
    <div class="status" id="status"></div>
    <div class="foot">
      <span class="tag">LIVE</span>
      <a href="/api/time">/api/time</a>
      <span>·</span>
      <a href="/time.html">/time.html</a>
    </div>
  </main>

  <script>
    (function () {
      var weekdaysZh = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      var weekdaysEn = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var moods = ["🌙", "🌅", "☀️", "🌤️", "🌇", "🌃", "✨"];

      var btn = document.getElementById("btn");
      var statusEl = document.getElementById("status");
      var placeholder = document.getElementById("placeholder");
      var content = document.getElementById("content");
      var clockEl = document.getElementById("clock");
      var moodEl = document.getElementById("mood");

      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function periodLabel(hours) {
        if (hours < 5) return "夜猫子你好";
        if (hours < 9) return "早安呀";
        if (hours < 12) return "上午好";
        if (hours < 14) return "午饭时间到";
        if (hours < 18) return "下午好";
        if (hours < 22) return "晚上好";
        return "夜深了，早点睡";
      }

      function moodFor(hours) {
        if (hours < 5) return moods[0];
        if (hours < 8) return moods[1];
        if (hours < 11) return moods[2];
        if (hours < 14) return moods[3];
        if (hours < 18) return moods[4];
        if (hours < 22) return moods[5];
        return moods[6];
      }

      function formatFromApi(data) {
        var raw = data.local || data.utc;
        var d = new Date(raw);
        if (isNaN(d.getTime())) throw new Error("无法解析时间: " + raw);

        var h = d.getHours();
        var m = d.getMinutes();
        var s = d.getSeconds();
        var y = d.getFullYear();
        var mo = d.getMonth() + 1;
        var day = d.getDate();
        var wd = d.getDay();

        document.getElementById("greeting").textContent =
          periodLabel(h) + " · " + weekdaysZh[wd] + " / " + weekdaysEn[wd];
        document.getElementById("dateLine").textContent =
          y + "年" + mo + "月" + day + "日 · " + weekdaysZh[wd];
        clockEl.textContent = pad(h) + ":" + pad(m) + ":" + pad(s);
        document.getElementById("tz").textContent = data.timeZone || "—";
        document.getElementById("unix").textContent =
          data.unixMs != null ? String(data.unixMs) : "—";
        document.getElementById("utc").textContent = data.utc
          ? String(data.utc).replace("T", " ").replace(/\+.*/, " UTC")
          : "—";

        moodEl.textContent = moodFor(h);
        moodEl.classList.remove("pop");
        void moodEl.offsetWidth;
        moodEl.classList.add("pop");
        clockEl.classList.remove("bump");
        void clockEl.offsetWidth;
        clockEl.classList.add("bump");

        placeholder.hidden = true;
        content.hidden = false;
      }

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = "status" + (kind ? " " + kind : "");
      }

      async function refresh() {
        btn.disabled = true;
        setStatus("正在呼叫服务器…");
        try {
          var res = await fetch("/api/time", { headers: { "Accept": "application/json" } });
          if (!res.ok) throw new Error("HTTP " + res.status);
          var data = await res.json();
          formatFromApi(data);
          setStatus("已更新 · " + new Date().toLocaleTimeString(), "ok");
        } catch (err) {
          setStatus("哎呀失败了：" + (err && err.message ? err.message : String(err)), "err");
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", refresh);
      document.getElementById("btnHome").addEventListener("click", function () {
        window.location.href = "/";
      });
    })();
  </script>
</body>
</html>
